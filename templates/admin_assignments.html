{% extends "base.html" %}
{% block content %}

<h1>Admin Assignment Management</h1>
<p>Assign students to advisors and advisors to HODs.</p>

<div class="panel">
    <h3>Assign HOD to Advisor</h3>

    <form method="POST" action="/admin/assign-hod">
        <label>Select Advisor</label>
        <select name="advisor_id" required>
            {% for advisor in advisors %}
            <option value="{{ advisor.id }}">
                {{ advisor.name }}
            </option>
            {% endfor %}
        </select>

        <label>Select HOD</label>
        <select name="hod_id" required>
            {% for hod in hods %}
            <option value="{{ hod.id }}">
                {{ hod.name }}
            </option>
            {% endfor %}
        </select>

        <button class="btn green">Assign HOD</button>
    </form>
</div>

<div class="panel">
    <h3>Assign Advisor to Student</h3>

    <form method="POST" action="/admin/assign-advisor">
        <label>Select Student</label>
        <select name="student_id" required>
            {% for student in students %}
            <option value="{{ student.id }}">
                {{ student.name }}
            </option>
            {% endfor %}
        </select>

        <label>Class Name</label>
        <input name="class_name" required placeholder="Example: AI&DS - A">

        <label>Select Advisor</label>
        <select name="advisor_id" required>
            {% for advisor in advisors %}
            <option value="{{ advisor.id }}">
                {{ advisor.name }}
            </option>
            {% endfor %}
        </select>

        <button class="btn green">Assign Advisor</button>
    </form>
</div>

<div class="panel">
    <h3>Create Faculty Account</h3>

    <form method="POST" action="/admin/create-faculty">

        <label>Faculty Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter faculty name"
            required
        >

        <label>Faculty Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter faculty email"
            required
        >

        <label>Phone Number</label>
        <input
            type="text"
            name="phone"
            placeholder="+91XXXXXXXXXX"
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create faculty password"
            required
        >

        <button type="submit" class="btn green">
            Create Faculty Account
        </button>

    </form>
</div>

{% endblock %}
