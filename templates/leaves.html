{% extends "base.html" %}{% block content %}<h1>Leave Requests</h1><div class="panel"><h3>Submit a leave request</h3><form method="post" class="form-grid"><label>Subject<input name="subject" required></label><label>Start date<input type="date" name="start_date" required></label><label>End date<input type="date" name="end_date" required></label><label class="wide">Reason<textarea name="reason"></textarea></label><button class="btn green">Submit Request</button></form></div><div class="panel"><h3>Your requests</h3>{% for r in rows %}<div class="leave-row"><div><b>{{r.subject}}</b><small>{{r.start_date}} to {{r.end_date}}</small></div><span class="pill">{{r.status}}</span></div>{% else %}<p>No requests.</p>{% endfor %}</div>{% endblock %}
